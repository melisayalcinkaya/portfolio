name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Pages yayını için gereken en az izin
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Birim testleri
        run: npm test
      - name: Chromium kur
        run: npx playwright install --with-deps chromium
      - name: Tarayıcı testleri (taşma, menü, CV dosyaları)
        run: npm run e2e
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    # Yalnızca main dalına yapılan push'larda yayınla (PR'larda değil)
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
